<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hekate demo: playground</title>
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <h1>Playground</h1>
      <p>
        The query string sets attributes on the component. Example:
        <code>playground.html?words=3&amp;theme=dark&amp;separator=-</code>. The parameter
        <code>width</code> sets the width of the parent in pixels. The parameter
        <code>assets</code> loads hekate.js from another folder.
      </p>
      <div id="host"></div>
      <script type="module" src="demo.js"></script>
    </main>
  </body>
</html>
