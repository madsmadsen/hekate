[workspace]
resolver = "3"
members = ["crates/hekate-core", "crates/hekate-wasm", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/madsmadsen/hekate"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
