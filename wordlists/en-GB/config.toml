# English (UK) word list. See wordlists/README.md for the meaning of each key.
code = "en-GB"
name = "English (UK)"
built_on = "2026-10-07"

# PRD 7.1: skip the top s ranks, take words up to rank r, make a list of n words.
# These are the proposed values. The benchmark of PRD 7.6 decides the final values.
s = 1000
r = 30000
n = 7776
min_len = 3
max_len = 9
alphabet = "a-z"

# English words are lowercase, so the lexicon words must be lowercase too.
lexicon_case = "exact"

# PRD 7.4, table 7.1: English removes accents.
[ascii]
strip_accents = true

# ---------------------------------------------------------------------------
# Frequency source: Google Books Ngram v3, British English (eng-gb), 1-grams.
# The build counts only plain tokens (no part-of-speech tag), lowercases them,
# and adds the counts of the years 1950 to 2019. Modern books give modern words.
# `min_count` drops tokens that occur fewer than 1,000 times in one file. This keeps
# memory small. The word at rank 50,000 has a total count of about 3,000. That is above this limit.
# ---------------------------------------------------------------------------
[[sources]]
name = "Google Books Ngram v3, British English (eng-gb)"
role = "frequency"
format = "ngram-1gram-tsv"
version = "20200217"
license = "CC BY 3.0"
license_url = "https://creativecommons.org/licenses/by/3.0/"
url = "https://storage.googleapis.com/books/ngrams/books/datasetsv3.html"
credit = "Google Books Ngram Viewer data (British English corpus eng-gb, version 20200217). Copyright Google. Licensed under CC BY 3.0. Michel et al., Science 2011."
year_min = 1950
year_max = 2019
min_count = 1000

