# Español word list. See wordlists/README.md for the meaning of each key.
code = "es"
name = "Español"
built_on = "2026-10-07"

# PRD 7.1: skip the top s ranks, take words up to rank r, make a list of n words.
# These are the proposed values. The benchmark of PRD 7.6 decides the final values.
s = 1000
r = 30000
n = 7776
min_len = 3
max_len = 9
alphabet = "a-záéíóúüñ"

# Spanish words are lowercase, so the lexicon words must be lowercase too.
lexicon_case = "exact"

# PRD 7.4, table 7.1: Spanish removes accents. ñ becomes n, ü becomes u.
[ascii]
strip_accents = true

[ascii.map]
"ñ" = "n"
"ü" = "u"

# ---------------------------------------------------------------------------
# Frequency source: Google Books Ngram v3, Spanish corpus (spa), 1-grams.
# The build counts only plain tokens (no part-of-speech tag), lowercases them,
# and adds the counts of the years 1950 to 2019. Modern books give modern words.
# `min_count` drops tokens that occur fewer than 200 times in one file. This keeps
# memory small. It is far below the count of the word at rank 30,000.
# The corpus holds many foreign and scanning-error tokens. The lexicon removes them.
# ---------------------------------------------------------------------------
[[sources]]
name = "Google Books Ngram v3, Spanish (spa)"
role = "frequency"
format = "ngram-1gram-tsv"
version = "20200217"
license = "CC BY 3.0"
license_url = "https://creativecommons.org/licenses/by/3.0/"
url = "https://storage.googleapis.com/books/ngrams/books/datasetsv3.html"
credit = "Google Books Ngram Viewer data (Spanish corpus spa, version 20200217). Copyright Google. Licensed under CC BY 3.0. Michel et al., Science 2011."
year_min = 1950
year_max = 2019
min_count = 200

