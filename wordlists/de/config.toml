# ---------------------------------------------------------------------------
# Lexicon: Wikidata Lexemes (CC0), the dump of 2026-09-30.
# A lexeme has a lemma and many forms. The build reads the lemma and every form
# written in `de`. It leaves out lexemes of the category "proper noun" (Q147276),
# so that names do not enter the lexicon. See the notes at the top of this file.
# ---------------------------------------------------------------------------
[[sources]]
name = "Wikidata Lexemes (Deutsch)"
role = "lexicon"
format = "wikidata-lexemes"
version = "dump of 2026-09-30"
license = "CC0"
license_url = "https://creativecommons.org/publicdomain/zero/1.0/"
url = "https://www.wikidata.org/wiki/Wikidata:Lexicographical_data"
credit = "Wikidata Lexemes, dump of 2026-09-30. Lexeme data of Wikidata is available under the CC0 license."
language_qid = "Q188"
lang_code = "de"
exclude_categories = ["Q147276"]

