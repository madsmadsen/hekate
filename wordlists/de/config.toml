# Deutsch word list. See wordlists/README.md for the meaning of each key.
# Notes on the choices (all values were checked on the built list):
# - S = 1000 and R = 30000 are used as proposed. After all filters, 98,000 candidates remain
#   between the ranks, so the list needs no change of S or R (PRD 7.6 rule 1).
# - The Wikidata Lexemes dump (CC0) gave a usable lexicon. The GPL backup (LibreOffice Hunspell) is not used,
#   so the list is not copyleft.
# - The lexicon keeps the lemma and all forms of every lexeme except proper nouns (Q147276).
#   Nouns, verbs and adjectives all stay, so inflected forms are not lost.
#   `fold` lowercases the capitalised noun forms.
# - The dump still holds some abbreviations, English words, names and old spellings.
#   These are in blocklist.txt. A native speaker still has to review the list.
# - The cache key holds the language item, so German and Italian each read the dump once.
code = "de"
name = "Deutsch"
built_on = "2026-10-07"

# PRD 7.1: skip the top s ranks, take words up to rank r, make a list of n words.
# S = 1000 and R = 30000 are the values that the PRD proposes. It stays as proposed: the list is large enough.
# The benchmark of PRD 7.6 and the native speakers decide the final values.
s = 1000
r = 30000
n = 7776
min_len = 3
max_len = 9
alphabet = "a-zäöüß"

# German nouns are written with a capital letter in the lexicon. The final list is
# lowercase, and the Ngram counts are lowercase. `fold` lowercases the lexicon words.
# This keeps the nouns. Proper nouns are left out of the lexicon (see the lexicon source).
lexicon_case = "fold"

# PRD 7.4, table 7.1.
[ascii]
strip_accents = false
map = { "ä" = "ae", "ö" = "oe", "ü" = "ue", "ß" = "ss" }

# ---------------------------------------------------------------------------
# Frequency source: Google Books Ngram v3, corpus `ger`, 1-grams.
# The build counts only plain tokens (no part-of-speech tag), lowercases them,
# and adds the counts of the years 1950 to 2019. Modern books give modern words.
# `min_count` drops tokens that occur fewer than 300 times in one file. This keeps
# memory small. The words around rank 30,000 have a much higher total count.
# ---------------------------------------------------------------------------
[[sources]]
name = "Google Books Ngram v3, German (ger)"
role = "frequency"
format = "ngram-1gram-tsv"
version = "20200217"
license = "CC BY 3.0"
license_url = "https://creativecommons.org/licenses/by/3.0/"
url = "https://storage.googleapis.com/books/ngrams/books/datasetsv3.html"
credit = "Google Books Ngram Viewer data (German corpus ger, version 20200217). Copyright Google. Licensed under CC BY 3.0. Michel et al., Science 2011."
year_min = 1950
year_max = 2019
min_count = 300

