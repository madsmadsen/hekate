# One nginx configuration for development, for CI, and as an example of a
# correct deployment (PRD section 9.1).
#
# Two servers, so that the demo page and the asset files have different origins:
#   8080  the demo page (the host page)
#   8081  the asset host: hekate.js, hekate.wasm, word lists, translations
#
# This file shows a correct deployment. It has no fault injection. End-to-end
# tests make HTTP 404 and 500 errors and changed bytes with Playwright
# (`page.route()`). They do not change this server.
#
# Only the "server" level sets headers. A "location" block that sets any header
# would remove all headers of the server level. Do not add one.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The container may run with a read-only file system.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout;

    # The browser must know the type of the WASM module (SR-12).
    # Word lists are UTF-8 text.
    types {
        application/wasm wasm;
        text/javascript  js mjs;
        application/json json;
        text/plain       txt;
    }
    charset utf-8;
    charset_types text/plain text/javascript application/json text/html text/css;

    # No cache and no conditional requests. Each request gets the files again (SR-8).
    etag off;
    if_modified_since off;
    sendfile on;
    autoindex off;
    server_tokens off;

    # The demo page. The CSP is the one of PRD section 6 (SR-6).
    server {
        listen 8080;
        server_name _;
        root /srv/demo;
        index index.html;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' http://localhost:8081; style-src 'self'; connect-src 'self' http://localhost:8081; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # The asset host. Any page on any origin can load these files (SR-12).
    # The server sends no cookies and does not accept credentials.
    server {
        listen 8081;
        server_name _;
        root /srv/dist;

        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
